<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Galaxies RP</title>
	<style>
		:root {
			--bg: #0a0f19;
			--bg-panel: #121826;
			--border: rgba(255, 180, 50, 0.45);
			--primary: #ffb432;
			--secondary: #c8c8c8;
			--accent: #50c8ff;
			--danger: #ff3c3c;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: var(--bg);
			color: var(--secondary);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.bg-grid {
			position: fixed;
			inset: 0;
			background:
				linear-gradient(rgba(255, 180, 50, 0.04) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 180, 50, 0.04) 1px, transparent 1px);
			background-size: 48px 48px;
			opacity: 0.35;
			pointer-events: none;
		}

		.bg-glow {
			position: fixed;
			width: 60vw;
			height: 60vw;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(80, 200, 255, 0.08) 0%, transparent 70%);
			top: -10%;
			right: -10%;
			pointer-events: none;
		}

		.bg-glow.amber {
			background: radial-gradient(circle, rgba(255, 180, 50, 0.07) 0%, transparent 70%);
			left: -15%;
			bottom: -20%;
			top: auto;
			right: auto;
		}

		.scanlines {
			position: fixed;
			inset: 0;
			background: repeating-linear-gradient(
				to bottom,
				rgba(0, 0, 0, 0) 0,
				rgba(0, 0, 0, 0) 2px,
				rgba(0, 0, 0, 0.08) 3px
			);
			pointer-events: none;
		}

		.frame {
			position: relative;
			width: min(920px, 92vw);
			padding: 28px 32px 24px;
			background: rgba(10, 15, 25, 0.92);
			border: 1px solid var(--border);
			box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
		}

		.frame::before {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 3px;
			background: linear-gradient(90deg, var(--primary), var(--accent));
		}

		.brand {
			margin-bottom: 22px;
		}

		.brand-kicker {
			color: var(--accent);
			font-size: 12px;
			letter-spacing: 0.28em;
			text-transform: uppercase;
			margin-bottom: 8px;
		}

		.brand-title {
			color: var(--primary);
			font-size: clamp(36px, 6vw, 54px);
			font-weight: 700;
			line-height: 1;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		.brand-sub {
			margin-top: 10px;
			font-size: 15px;
			color: var(--secondary);
		}

		.info-grid {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 12px;
			margin-bottom: 22px;
		}

		.info-card {
			background: var(--bg-panel);
			border: 1px solid rgba(255, 180, 50, 0.18);
			padding: 12px 14px;
			min-height: 72px;
		}

		.info-label {
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			color: rgba(200, 200, 200, 0.65);
			margin-bottom: 6px;
		}

		.info-value {
			color: var(--primary);
			font-size: 15px;
			font-weight: 600;
			word-break: break-word;
		}

		.progress-block {
			margin-bottom: 14px;
		}

		.progress-top {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			margin-bottom: 8px;
			gap: 12px;
		}

		.progress-label {
			font-size: 12px;
			text-transform: uppercase;
			letter-spacing: 0.14em;
			color: var(--accent);
		}

		.progress-count {
			font-size: 12px;
			color: rgba(200, 200, 200, 0.75);
			white-space: nowrap;
		}

		.progress-track {
			height: 10px;
			background: rgba(255, 255, 255, 0.06);
			border: 1px solid rgba(255, 180, 50, 0.15);
			overflow: hidden;
		}

		.progress-fill {
			height: 100%;
			width: 0%;
			background: linear-gradient(90deg, var(--primary), var(--accent));
			transition: width 0.25s ease;
		}

		.status-line {
			min-height: 20px;
			font-size: 14px;
			color: var(--secondary);
		}

		.file-line {
			margin-top: 8px;
			font-size: 12px;
			color: rgba(200, 200, 200, 0.55);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.footer {
			margin-top: 18px;
			padding-top: 14px;
			border-top: 1px solid rgba(255, 180, 50, 0.12);
			font-size: 12px;
			color: rgba(200, 200, 200, 0.45);
		}

		@media (max-width: 720px) {
			.info-grid {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="bg-grid"></div>
	<div class="bg-glow"></div>
	<div class="bg-glow amber"></div>
	<div class="scanlines"></div>

	<div class="frame">
		<div class="brand">
			<div class="brand-kicker">Outer Rim Network</div>
			<div class="brand-title">Galaxies RP</div>
			<div class="brand-sub">Star Wars Galaxies Roleplay</div>
		</div>

		<div class="info-grid">
			<div class="info-card">
				<div class="info-label">Server</div>
				<div class="info-value" id="server-name">Connecting...</div>
			</div>
			<div class="info-card">
				<div class="info-label">Map</div>
				<div class="info-value" id="map-name">...</div>
			</div>
			<div class="info-card">
				<div class="info-label">Gamemode</div>
				<div class="info-value" id="gamemode-name">...</div>
			</div>
		</div>

		<div class="progress-block">
			<div class="progress-top">
				<div class="progress-label">Transfer Progress</div>
				<div class="progress-count" id="file-count">Preparing...</div>
			</div>
			<div class="progress-track">
				<div class="progress-fill" id="progress-fill"></div>
			</div>
		</div>

		<div class="status-line" id="status-text">Establishing connection...</div>
		<div class="file-line" id="file-text"></div>

		<div class="footer">
			Choose your profession, build your story, and survive Imperial law.
		</div>
	</div>

	<script>
		var filesTotal = 0;
		var filesNeeded = 0;

		function setText(id, value) {
			var el = document.getElementById(id);
			if (el) el.textContent = value || "";
		}

		function updateProgress() {
			var fill = document.getElementById("progress-fill");
			var count = document.getElementById("file-count");

			if (!filesTotal || filesTotal <= 0) {
				if (fill) fill.style.width = "8%";
				if (count) count.textContent = "Preparing...";
				return;
			}

			var done = Math.max(0, filesTotal - filesNeeded);
			var pct = Math.floor((done / filesTotal) * 100);
			if (fill) fill.style.width = Math.max(8, pct) + "%";
			if (count) count.textContent = done + " / " + filesTotal + " files";
		}

		window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language, niceGamemode) {
			setText("server-name", servername || "Galaxies RP Server");
			setText("map-name", mapname || "Unknown");
			setText("gamemode-name", niceGamemode || gamemode || "Galaxies RP");
		};

		window.SetStatusChanged = function(status) {
			setText("status-text", status || "Loading...");
		};

		window.SetFilesTotal = function(total) {
			filesTotal = Math.max(0, parseInt(total, 10) || 0);
			updateProgress();
		};

		window.SetFilesNeeded = function(needed) {
			filesNeeded = Math.max(0, parseInt(needed, 10) || 0);
			updateProgress();
		};

		window.DownloadingFile = function(fileName) {
			setText("file-text", fileName ? ("Downloading: " + fileName) : "");
		};
	</script>
</body>
</html>
